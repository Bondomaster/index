<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Gửi Ph Tu Quynh 💖</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Dancing+Script:wght@600&family=Be+Vietnam+Pro:wght@300;400;600&display=swap&subset=vietnamese"
    rel="stylesheet" />
  <style>
    :root {
      --pink: #ff6fae;
      --rose: #ff3d84;
      --gold: #ffd9a8;
      --text: #fff1f6;
      --serif: "Playfair Display", "Times New Roman", Georgia, serif;
      --script: "Dancing Script", "Segoe Script", "Brush Script MT", cursive;
      --sans: "Be Vietnam Pro", "Segoe UI", Roboto, Arial, sans-serif;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    @property --a {
      syntax: "<angle>";
      inherits: false;
      initial-value: 0deg;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: radial-gradient(circle at 50% 30%, #4a1240, #2a0a24 70%);
      color: var(--text);
      font-family: var(--sans);
    }

    .glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      pointer-events: none;
      animation: drift 14s ease-in-out infinite alternate;
    }

    .g1 {
      width: 50vmax;
      height: 50vmax;
      background: #ff2d8a;
      left: -15vmax;
      top: -10vmax;
    }

    .g2 {
      width: 40vmax;
      height: 40vmax;
      background: #8a3dff;
      right: -12vmax;
      bottom: -10vmax;
      animation-delay: -7s;
    }

    @keyframes drift {
      to {
        transform: translate(6vmax, 5vmax) scale(1.15);
        opacity: 0.5;
      }
    }

    .star {
      position: fixed;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #fff;
      animation: tw 3s infinite alternate;
      pointer-events: none;
    }

    @keyframes tw {
      from {
        opacity: 0.1;
      }

      to {
        opacity: 0.9;
        box-shadow: 0 0 8px #fff;
      }
    }

    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      transition: opacity 1s, transform 1s;
      z-index: 2;
    }

    #stage.hide {
      opacity: 0;
      transform: scale(0.92);
      pointer-events: none;
    }

    .line {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      font-family: var(--serif);
      font-weight: 900;
      line-height: 1.15;
    }

    .l1 {
      font-size: clamp(1.9rem, 8.5vw, 4rem);
      color: #fff;
    }

    .l2 {
      font-size: clamp(2.6rem, 12vw, 5.8rem);
      color: var(--pink);
      text-shadow: 0 0 30px var(--rose);
    }

    .slot {
      display: inline-block;
      opacity: 0;
      min-width: 0.05em;
    }

    .slot.sp {
      min-width: 0.35em;
    }

    .slot.ok {
      opacity: 1;
      animation: pop 0.6s, wave 3s ease-in-out 1s infinite;
    }

    @keyframes pop {
      0% {
        transform: scale(1.6);
        filter: brightness(2.5);
      }

      100% {
        transform: none;
        filter: none;
      }
    }

    @keyframes wave {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    .fly {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 3;
      pointer-events: none;
      font-family: var(--serif);
      font-weight: 900;
      color: #ffb3d4;
      text-shadow: 0 0 14px var(--rose);
      will-change: transform;
      transition: opacity 1s;
    }

    #hint {
      font-family: var(--script);
      font-size: 1.6rem;
      color: var(--gold);
      animation: pulse 1.6s infinite;
      margin-top: 1rem;
      text-align: center;
      padding: 0 1rem;
    }

    @keyframes pulse {
      50% {
        opacity: 0.5;
        transform: scale(1.05);
      }
    }

    #btn,
    .b2 {
      position: relative;
      overflow: hidden;
      padding: 0.85rem 2rem;
      border: 0;
      border-radius: 99px;
      font: 600 1.05rem var(--sans);
      color: #fff;
      cursor: pointer;
      background: linear-gradient(135deg, #ff6fae, #ff3d84);
      box-shadow: 0 0 28px rgba(255, 61, 132, 0.55);
      transition: transform 0.2s;
      z-index: 5;
      animation: btnglow 2s ease-in-out infinite;
    }

    #btn::after {
      content: "";
      position: absolute;
      top: 0;
      left: -60%;
      width: 40%;
      height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.6), transparent);
      transform: skewX(-20deg);
      animation: sweep 2.6s infinite;
    }

    @keyframes sweep {
      to {
        left: 140%;
      }
    }

    @keyframes btnglow {
      50% {
        box-shadow: 0 0 46px rgba(255, 61, 132, 0.9);
      }
    }

    #btn:hover,
    .b2:hover {
      transform: scale(1.07);
    }

    #card {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 1rem;
      z-index: 4;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.2s;
      overflow-y: auto;
    }

    #card.show {
      opacity: 1;
      pointer-events: auto;
    }

    .box {
      position: relative;
      margin: auto;
      max-width: 420px;
      width: 100%;
      text-align: center;
      padding: 1.5rem 1.1rem 1.1rem;
      border-radius: 24px;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0.04));
      border: 1px solid rgba(255, 182, 213, 0.4);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 25px 90px rgba(255, 61, 132, 0.35), inset 0 0 40px rgba(255, 150, 200, 0.08);
      transform: scale(0.85) translateY(30px);
      transition: transform 1.2s cubic-bezier(0.2, 1.3, 0.3, 1);
    }

    #card.show .box {
      transform: none;
    }

    .box.live {
      transition: transform 0.25s ease-out;
    }

    /* viền sáng chạy quanh thiệp */
    .box::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 26px;
      padding: 2px;
      background: conic-gradient(from var(--a), transparent 0 55%, #ff6fae, #ffd9a8, #fff, transparent);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
      animation: spin 5s linear infinite;
      pointer-events: none;
    }

    @keyframes spin {
      to {
        --a: 360deg;
      }
    }

    /* ánh sáng lướt qua thiệp */
    .box::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 24px;
      background: linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, 0.16) 50%, transparent 60%);
      background-size: 250% 100%;
      animation: glare 5s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes glare {
      0% {
        background-position: 150% 0;
      }

      60%,
      100% {
        background-position: -100% 0;
      }
    }


    .mascot {
      display: block;
      width: 130px;
      margin: -0.2rem auto 0.5rem;
      filter: drop-shadow(0 0 14px rgba(252, 251, 251, 0.7));
      animation: mfloat 3.2s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes mfloat {

      0%,
      100% {
        transform: translateY(0) rotate(-3deg);
      }

      50% {
        transform: translateY(-8px) rotate(3deg);
      }
    }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.8rem;
      border-radius: 99px;
      font-size: 0.66rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #4a1240;
      font-weight: 600;
      background: linear-gradient(90deg, #ffd9a8, #ffb3d4);
      box-shadow: 0 0 20px rgba(255, 217, 168, 0.5);
    }

    .big {
      font-size: 2.1rem;
      margin: 0.4rem 0 0;
      animation: beat 1.2s infinite;
    }

    @keyframes beat {
      15% {
        transform: scale(1.25);
      }

      30% {
        transform: scale(1);
      }

      45% {
        transform: scale(1.18);
      }
    }

    .t1 {
      font-family: var(--script);
      font-size: 1.25rem;
      color: var(--gold);
      margin: 0;
    }

    .t2 {
      font-family: var(--serif);
      font-size: clamp(1.7rem, 8vw, 2.4rem);
      margin: 0 0 0.2rem;
      background: linear-gradient(90deg, #ff9ec8, #fff, #ffd9a8, #ff6fae, #ff9ec8);
      background-size: 250% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: sh 5s linear infinite;
    }

    @keyframes sh {
      to {
        background-position: -250% 0;
      }
    }

    .orn {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      justify-content: center;
      color: var(--pink);
      margin: 0.4rem 0 1rem;
    }

    .orn:before,
    .orn:after {
      content: "";
      height: 1px;
      width: 22%;
      background: linear-gradient(90deg, transparent, var(--pink));
    }

    .orn:after {
      transform: scaleX(-1);
    }

    #msg {
      font-weight: 300;
      font-size: 0.88rem;
      line-height: 1.7;
      min-height: 6.4em;
      margin: 0 0.3rem;
    }

    .wishes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.45rem;
      margin: 0.8rem 0;
    }

    .w {
      padding: 0.55rem 0.45rem;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 182, 213, 0.25);
      opacity: 0;
      transform: translateY(20px) scale(0.9);
      transition: all 0.8s cubic-bezier(0.2, 1.4, 0.3, 1);
    }

    .w.on {
      opacity: 1;
      transform: none;
    }

    .w.on:hover {
      transform: translateY(-4px) scale(1.04);
      background: rgba(255, 255, 255, 0.14);
      box-shadow: 0 8px 24px rgba(255, 61, 132, 0.3);
    }

    .w i {
      font-style: normal;
      font-size: 1.2rem;
      display: block;
    }

    .w.on i {
      animation: bob 2.6s ease-in-out infinite;
    }

    .w:nth-child(2).on i {
      animation-delay: -0.6s;
    }

    .w:nth-child(3).on i {
      animation-delay: -1.2s;
    }

    .w:nth-child(4).on i {
      animation-delay: -1.8s;
    }

    @keyframes bob {
      50% {
        transform: translateY(-4px) rotate(8deg);
      }
    }

    .w b {
      display: block;
      font-family: var(--serif);
      font-size: 0.82rem;
      color: #ffc2dc;
      margin: 0.2rem 0;
    }

    .w span {
      font-size: 0.68rem;
      font-weight: 300;
      opacity: 0.85;
      line-height: 1.5;
      display: block;
    }

    .quote {
      font-family: var(--script);
      font-size: 1.1rem;
      color: var(--gold);
      line-height: 1.5;
      opacity: 0;
      transition: opacity 1.2s;
    }

    .sign {
      font-family: var(--script);
      font-size: 1.2rem;
      color: var(--pink);
      margin: 0.4rem 0 0.3rem;
      opacity: 0;
      transition: opacity 1.2s;
    }

    .on2 {
      opacity: 1;
    }

    .btns {
      display: flex;
      gap: 0.7rem;
      justify-content: center;
      flex-wrap: wrap;
      opacity: 0;
      transition: opacity 1s;
    }

    .heart {
      position: fixed;
      bottom: -50px;
      z-index: 1;
      pointer-events: none;
      animation: up linear forwards;
      filter: drop-shadow(0 0 8px rgba(255, 61, 132, 0.7));
    }

    @keyframes up {
      to {
        transform: translate(var(--dx), -115vh) rotate(var(--rot));
        opacity: 0;
      }
    }

    .burst {
      position: fixed;
      z-index: 9;
      pointer-events: none;
      animation: bst 0.9s ease-out forwards;
    }

    @keyframes bst {
      to {
        transform: translate(var(--bx), var(--by)) scale(0.3);
        opacity: 0;
      }
    }

    /* cánh hoa rơi */
    .petal {
      position: fixed;
      top: -30px;
      z-index: 6;
      pointer-events: none;
      border-radius: 150% 0 150% 0;
      background: linear-gradient(135deg, #ffd1e6, #ff7eb6);
      box-shadow: 0 0 10px rgba(255, 126, 182, 0.6);
      animation: fall linear forwards;
    }

    @keyframes fall {
      0% {
        transform: translate(0, 0) rotate(0) rotateX(0);
      }

      50% {
        transform: translate(var(--sw), 55vh) rotate(180deg) rotateX(180deg);
      }

      100% {
        transform: translate(calc(var(--sw) * -0.6), 112vh) rotate(380deg) rotateX(360deg);
        opacity: 0.2;
      }
    }

    /* sao băng */
    .shoot {
      position: fixed;
      z-index: 1;
      width: 140px;
      height: 2px;
      pointer-events: none;
      background: linear-gradient(90deg, transparent, #fff);
      border-radius: 2px;
      filter: drop-shadow(0 0 6px #ffb3d4);
      transform: rotate(28deg);
      opacity: 0;
      animation: shoot 1.3s ease-out forwards;
    }

    @keyframes shoot {
      0% {
        opacity: 0;
        transform: translate(0, 0) rotate(28deg);
      }

      15% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: translate(380px, 200px) rotate(28deg);
      }
    }

    #fx {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 8;
      pointer-events: none;
    }

    .ripple {
      position: fixed;
      z-index: 9;
      width: 20px;
      height: 20px;
      margin: -10px 0 0 -10px;
      border-radius: 50%;
      border: 2px solid rgba(255, 182, 213, 0.8);
      pointer-events: none;
      animation: rip 0.9s ease-out forwards;
    }

    @keyframes rip {
      to {
        transform: scale(9);
        opacity: 0;
      }
    }

    * {
      cursor: none !important;
    }

    #cur {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 99;
      pointer-events: none;
      font-size: 26px;
      color: #ff3d84;
      text-shadow: 0 0 12px #ff3d84, 0 0 28px #ff6fae;
      opacity: 0;
      transition: opacity 0.3s;
    }

    #cur span {
      display: inline-block;
      animation: beat 1.2s infinite;
    }

    .trail {
      position: fixed;
      z-index: 98;
      pointer-events: none;
      color: #ff6fae;
      transform: translate(-50%, -50%);
      animation: tr 1.1s ease-out forwards;
      text-shadow: 0 0 8px rgba(255, 61, 132, 0.8);
    }

    @keyframes tr {
      to {
        transform: translate(calc(-50% + var(--tx)), -90px) scale(0.4);
        opacity: 0;
      }
    }

    .btns small {
      font-size: 0.7rem;
      opacity: 0.65;
      letter-spacing: 0.06em;
      font-weight: 300;
    }


    /* sương mù cào thẻ */
    #fog {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 50;
      touch-action: none;
      transition: opacity 1.4s ease, filter 1.4s ease;
    }

    #fog.gone {
      opacity: 0;
      filter: blur(14px);
      pointer-events: none;
    }

    #fogHint {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 51;
      pointer-events: none;
      text-align: center;
      width: 88%;
      font-family: var(--script);
      font-size: clamp(1.5rem, 6vw, 2.2rem);
      color: #8a2a6a;
      text-shadow: 0 0 14px #fff, 0 0 30px rgba(255, 255, 255, 0.9);
      transition: opacity 0.8s;
    }

    #fogHint small {
      display: block;
      font-family: var(--sans);
      font-size: 0.7rem;
      font-weight: 300;
      letter-spacing: 0.12em;
      margin-top: 0.5rem;
      opacity: 0.8;
    }

    #fogHint.off {
      opacity: 0;
    }

    @media (prefers-reduced-motion: reduce) {

      .petal,
      .shoot {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="glow g1"></div>
  <div class="glow g2"></div>

  <div id="stage">
    <div class="line l1" id="l1"></div>
    <div class="line l2" id="l2"></div>
    <div id="hint">✦ Có một thông điệp đang bay lạc... ✦</div>
    <button id="btn">Giải mã 💌</button>
  </div>

  <script>
    const CFG = {
      l1: "CHÚC MỪNG 20/10",
      l2: "Ph Tu Quynh",
      name: "Ph Tu Quynh",
      intro:
        "Nhân ngày 20/10, chúc chị luôn xinh đẹp, rạng rỡ như đóa hồng đầu mùa. Mong mỗi ngày của chị đều ngập tràn tiếng cười và thật nhiều yêu thương. 🌸",
      wishes: [
        ["🌸", "Luôn xinh đẹp", "Rạng rỡ từ nụ cười đến trái tim."],
        ["💖", "Thật hạnh phúc", "Mỗi ngày đều có một niềm vui nhỏ."],
        ["✨", "Bình yên", "Nhẹ nhàng giữa mọi bộn bề."],
        ["🌹", "Được yêu thương", "Nhiều hơn chị có thể đếm hết."],
      ],
      quote:
        "Cảm ơn chị vì đã xuất hiện và làm thế giới này dịu dàng hơn rất nhiều.",
      sign: "— Một người luôn nghĩ đến chị🌹",
    };
    const POOL = "CHUCCHI2010VUIVE-ABCDEFGHTHAFDASFASF2006";
    const rnd = (a) =>
      Array.isArray(a) || typeof a === "string"
        ? a[Math.floor(Math.random() * a.length)]
        : 0;
    const R = (a, b) => Math.random() * (b - a) + a;
    const $ = (id) => document.getElementById(id);

    for (let i = 0; i < 60; i++) {
      const s = document.createElement("div");
      s.className = "star";
      s.style.cssText = `left:${R(0, 100)}vw;top:${R(0, 100)}vh;animation-delay:${R(0, 3)}s`;
      document.body.appendChild(s);
    }

    $("name").textContent = CFG.name;
    $("sign").textContent = CFG.sign;
    $("quote").textContent = CFG.quote;
    $("wishes").innerHTML = CFG.wishes
      .map(
        (w) =>
          `<div class="w"><i>${w[0]}</i><b>${w[1]}</b><span>${w[2]}</span></div>`,
      )
      .join("");

    const flyers = [];
    let W = innerWidth,
      H = innerHeight,
      decoding = false,
      landed = 0,
      total = 0;
    function build(el, text, cls) {
      [...text].forEach((c) => {
        const s = document.createElement("span");
        s.className = "slot" + (c === " " ? " sp" : "");
        s.textContent = c === " " ? "\u00a0" : c;
        el.appendChild(s);
        if (c !== " ") flyers.push({ slot: s, c, cls, real: true });
      });
    }
    build($("l1"), CFG.l1, "l1");
    build($("l2"), CFG.l2, "l2");
    total = flyers.length;

    function init() {
      flyers.forEach((f) =>
        mk(f, parseFloat(getComputedStyle(f.slot).fontSize)),
      );
      for (let i = 0; i < 34; i++) {
        const f = { real: false, c: "", cls: "" };
        flyers.push(f);
        mk(f, R(18, 56));
      }
      requestAnimationFrame(tick);
    }
    function mk(f, size) {
      const e = document.createElement("div");
      e.className = "fly";
      e.style.fontSize = size + "px";
      e.style.opacity = f.real ? 1 : 0.55;
      e.style.color = rnd(["#ffb3d4", "#ff6fae", "#ffd9a8", "#e0b3ff", "#fff"]);
      e.textContent = rnd(POOL);
      document.body.appendChild(e);
      Object.assign(f, {
        el: e,
        x: R(0, W),
        y: R(0, H),
        vx: R(-2.6, 2.6),
        vy: R(-2.6, 2.6),
        rot: R(0, 360),
        vr: R(-4, 4),
        t: R(0, 6),
        sc: 1,
        state: "fly",
      });
    }
    function tick() {
      flyers.forEach((f) => {
        if (f.state === "done" || !f.el) return;
        if (f.state === "fly") {
          f.vx += R(-0.12, 0.12);
          f.vy += R(-0.12, 0.12);
          const m = Math.hypot(f.vx, f.vy),
            mx = 3.2;
          if (m > mx) {
            f.vx *= mx / m;
            f.vy *= mx / m;
          }
          f.x += f.vx;
          f.y += f.vy;
          f.rot += f.vr;
          f.t += 0.04;
          f.sc = 1 + Math.sin(f.t) * 0.35;
          if (f.x < 0 || f.x > W) f.vx *= -1;
          if (f.y < 0 || f.y > H) f.vy *= -1;
          f.x = Math.max(-10, Math.min(W + 10, f.x));
          f.y = Math.max(-10, Math.min(H + 10, f.y));
          if (f.real) sparkTrail(f);
        } else {
          const k = 0.075;
          f.x += (f.tx - f.x) * k;
          f.y += (f.ty - f.y) * k;
          f.rot += (0 - f.rot) * k;
          f.sc += (1 - f.sc) * k;
          if (f.real && Math.random() < 0.5) sparkTrail(f);
          if (Math.hypot(f.tx - f.x, f.ty - f.y) < 1.2 && Math.abs(f.rot) < 1)
            land(f);
        }
        f.el.style.transform = `translate(${f.x}px,${f.y}px) translate(-50%,-50%) rotate(${f.rot}deg) scale(${f.sc})`;
      });
      requestAnimationFrame(tick);
    }
    function land(f) {
      f.state = "done";
      f.el.remove();
      f.slot.classList.add("ok");
      sparkle(f.slot);
      if (++landed === total) {
        $("hint").textContent = "Giải mã thành công 💖";
        heartStorm();
        volley(5);
        setTimeout(showCard, 1800);
      }
    }
    setInterval(
      () =>
        flyers.forEach((f) => {
          if (f.el && f.state !== "done" && Math.random() < 0.4)
            f.el.textContent = rnd(POOL);
        }),
      150,
    );

    function decode() {
      if (decoding || !fogDone) return;
      decoding = true;
      $("btn").style.display = "none";
      $("hint").textContent = "...... ";
      let i = 0;
      flyers.forEach((f) => {
        if (f.real) {
          setTimeout(
            () => {
              const r = f.slot.getBoundingClientRect();
              f.tx = r.left + r.width / 2;
              f.ty = r.top + r.height / 2;
              f.rot = (((f.rot % 360) + 540) % 360) - 180;
              f.state = "go";
              f.el.textContent = f.c;
            },
            600 + i++ * 160,
          );
        } else {
          setTimeout(() => {
            f.el.style.opacity = 0;
          }, 500 + R(0, 1500));
          setTimeout(() => {
            f.state = "done";
            f.el.remove();
          }, 2600);
        }
      });
    }
    $("btn").onclick = decode;
    $("stage").addEventListener("click", (e) => {
      if (e.target.id !== "btn") decode();
    });
    addEventListener("resize", () => {
      W = innerWidth;
      H = innerHeight;
    });
    (document.fonts && document.fonts.ready
      ? document.fonts.ready
      : Promise.resolve()
    ).then(init);

    function sparkle(el) {
      const r = el.getBoundingClientRect();
      for (let i = 0; i < 4; i++)
        burst(r.left + r.width / 2, r.top + r.height / 2, "✦", 10);
    }
    function burst(x, y, ch, size) {
      const b = document.createElement("div");
      b.className = "burst";
      b.textContent = ch;
      b.style.cssText += `left:${x}px;top:${y}px;font-size:${size + R(0, 10)}px;color:#ffc2dc;--bx:${R(-70, 70)}px;--by:${R(-70, 70)}px`;
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 900);
    }
    const HEARTS = ["❤", "💖", "💗", "💕", "💘", "🌸", "🌹", "💝"];
    function heart() {
      const h = document.createElement("div");
      h.className = "heart";
      h.textContent = rnd(HEARTS);
      const d = R(5, 11);
      h.style.cssText += `left:${R(0, 100)}vw;font-size:${R(16, 44)}px;animation-duration:${d}s;--dx:${R(-80, 80)}px;--rot:${R(-40, 40)}deg;opacity:${R(0.6, 1)}`;
      document.body.appendChild(h);
      setTimeout(() => h.remove(), d * 1000);
    }
    function heartStorm() {
      for (let i = 0; i < 40; i++) setTimeout(heart, i * 60);
    }

    /* ===== HIỆU ỨNG MỚI ===== */
    // 1) Pháo hoa (tròn + hình trái tim) vẽ trên canvas
    const cv = document.createElement("canvas");
    cv.id = "fx";
    document.body.appendChild(cv);
    const cx = cv.getContext("2d");
    let parts = [],
      rockets = [];
    function fit() {
      const d = devicePixelRatio || 1;
      cv.width = innerWidth * d;
      cv.height = innerHeight * d;
      cx.setTransform(d, 0, 0, d, 0, 0);
    }
    fit();
    addEventListener("resize", fit);
    const FC = ["#ff6fae", "#ffd9a8", "#ffffff", "#e0b3ff", "#ff3d84", "#ffb3d4"];
    function firework(x, y, shape) {
      const c1 = rnd(FC),
        c2 = rnd(FC),
        n = 72;
      for (let i = 0; i < n; i++) {
        let vx, vy;
        if (shape === "heart") {
          const t = (i / n) * Math.PI * 2;
          vx = 16 * Math.pow(Math.sin(t), 3) * 0.2;
          vy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * 0.2;
        } else {
          const a = (i / n) * Math.PI * 2 + R(-0.05, 0.05),
            s = R(1.5, 5.2) * (i % 2 ? 1 : 0.6);
          vx = Math.cos(a) * s;
          vy = Math.sin(a) * s;
        }
        parts.push({
          x, y, px: x, py: y, vx, vy,
          life: 1,
          decay: R(0.011, 0.02),
          c: i % 3 ? c1 : c2,
          r: R(1.2, 2.6),
        });
      }
    }
    function launch(x, ty, shape) {
      rockets.push({ x, y: innerHeight + 10, ty, vy: -R(9, 12), shape });
    }
    function volley(n) {
      for (let i = 0; i < n; i++)
        setTimeout(
          () => launch(R(0.12, 0.88) * innerWidth, R(0.12, 0.45) * innerHeight, i % 2 ? "heart" : "round"),
          i * 350,
        );
    }
    function sparkTrail(f) {
      if (Math.random() < 0.25)
        parts.push({
          x: f.x, y: f.y, px: f.x, py: f.y,
          vx: R(-0.4, 0.4), vy: R(-0.4, 0.4),
          life: 1, decay: 0.04, c: "#ffd9a8", r: R(0.8, 1.6),
        });
    }
    function fxLoop() {
      cx.clearRect(0, 0, innerWidth, innerHeight);
      cx.globalCompositeOperation = "lighter";
      rockets = rockets.filter((r) => {
        r.y += r.vy;
        r.vy *= 0.985;
        cx.fillStyle = "#ffe";
        cx.fillRect(r.x - 1, r.y, 2, 8);
        if (r.y <= r.ty || r.vy > -2.5) {
          firework(r.x, r.y, r.shape);
          return false;
        }
        return true;
      });
      parts = parts.filter((p) => {
        p.px = p.x;
        p.py = p.y;
        p.vx *= 0.985;
        p.vy = p.vy * 0.985 + 0.045;
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        if (p.life <= 0) return false;
        cx.globalAlpha = p.life;
        cx.strokeStyle = p.c;
        cx.lineWidth = p.r;
        cx.lineCap = "round";
        cx.beginPath();
        cx.moveTo(p.px, p.py);
        cx.lineTo(p.x, p.y);
        cx.stroke();
        return true;
      });
      cx.globalAlpha = 1;
      requestAnimationFrame(fxLoop);
    }
    fxLoop();

    // 2) Cánh hoa đào rơi
    function petal() {
      const p = document.createElement("div");
      const s = R(9, 18),
        d = R(7, 13);
      p.className = "petal";
      p.style.cssText += `left:${R(0, 100)}vw;width:${s}px;height:${s * 0.8}px;opacity:${R(0.6, 0.95)};animation-duration:${d}s;--sw:${R(-120, 120)}px`;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), d * 1000);
    }
    setInterval(petal, 900);

    // 3) Sao băng
    function shoot() {
      const s = document.createElement("div");
      s.className = "shoot";
      s.style.cssText += `left:${R(0, 70)}vw;top:${R(0, 40)}vh`;
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 1400);
    }
    setInterval(shoot, 3200);
    setTimeout(shoot, 800);

    // 4) Gợn sóng khi chạm
    function ripple(x, y) {
      const r = document.createElement("div");
      r.className = "ripple";
      r.style.cssText += `left:${x}px;top:${y}px`;
      document.body.appendChild(r);
      setTimeout(() => r.remove(), 900);
    }

    // 5) Thiệp nghiêng 3D theo con trỏ
    const box = $("box");
    addEventListener("pointermove", (e) => {
      if (!box.classList.contains("live")) return;
      const r = box.getBoundingClientRect();
      const dx = (e.clientX - (r.left + r.width / 2)) / innerWidth,
        dy = (e.clientY - (r.top + r.height / 2)) / innerHeight;
      box.style.transform = `perspective(900px) rotateY(${dx * 14}deg) rotateX(${-dy * 14}deg)`;
    });
    document.addEventListener("mouseleave", () => (box.style.transform = ""));

    function showCard() {
      $("stage").classList.add("hide");
      $("card").classList.add("show");
      setInterval(heart, 280);
      heartStorm();
      setInterval(() => volley(2), 4500);
      setTimeout(() => box.classList.add("live"), 1500);
      let i = 0;
      setTimeout(function type() {
        $("msg").textContent = CFG.intro.slice(0, ++i);
        if (i < CFG.intro.length) setTimeout(type, 40);
        else {
          document
            .querySelectorAll(".w")
            .forEach((w, k) => setTimeout(() => w.classList.add("on"), k * 350));
          setTimeout(() => $("quote").classList.add("on2"), 1700);
          setTimeout(() => $("sign").classList.add("on2"), 2500);
          setTimeout(() => {
            $("btns").style.opacity = 1;
            volley(4);
          }, 3000);
        }
      }, 1200);
    }
    addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        if (!fogDone) return revealFog();
        if (!decoding) decode();
        else {
          heartStorm();
          volley(2);
        }
      }
    });

    // 6) Sương mù phủ màn hình — lau/cào để bước vào
    let fogDone = false;
    const fogCv = document.createElement("canvas");
    fogCv.id = "fog";
    document.body.appendChild(fogCv);
    const fctx = fogCv.getContext("2d");
    const fogHint = document.createElement("div");
    fogHint.id = "fogHint";
    fogHint.innerHTML = "✦ Lau lớp sương mù để bước vào ✦<small>vuốt hoặc kéo chuột để lau </small>";
    document.body.appendChild(fogHint);
    const CELL = 24;
    let cols, rows, seen, seenN, fogW = innerWidth;
    function paintFog() {
      const w = innerWidth, h = innerHeight, d = devicePixelRatio || 1;
      fogCv.width = w * d;
      fogCv.height = h * d;
      fctx.setTransform(d, 0, 0, d, 0, 0);
      fctx.globalCompositeOperation = "source-over";
      const g = fctx.createLinearGradient(0, 0, w, h);
      g.addColorStop(0, "#e8d0ea");
      g.addColorStop(0.5, "#f3e3f2");
      g.addColorStop(1, "#d9b9da");
      fctx.fillStyle = g;
      fctx.globalAlpha = 0.97;
      fctx.fillRect(0, 0, w, h);
      fctx.globalAlpha = 1;
      for (let i = 0; i < 90; i++) {
        const x = R(0, w), y = R(0, h), r = R(70, 260), pink = i % 3 === 0;
        const b = fctx.createRadialGradient(x, y, 0, x, y, r);
        b.addColorStop(0, pink ? "rgba(255,170,215,0.28)" : "rgba(255,255,255,0.32)");
        b.addColorStop(1, "rgba(255,255,255,0)");
        fctx.fillStyle = b;
        fctx.fillRect(x - r, y - r, r * 2, r * 2);
      }
      for (let i = 0; i < 1800; i++) {
        fctx.fillStyle = `rgba(255,255,255,${R(0.04, 0.14)})`;
        fctx.fillRect(R(0, w), R(0, h), R(1, 2.5), R(1, 2.5));
      }
      cols = Math.ceil(w / CELL);
      rows = Math.ceil(h / CELL);
      seen = new Uint8Array(cols * rows);
      seenN = 0;
      fogW = w;
    }
    paintFog();
    addEventListener("resize", () => {
      if (!fogDone && innerWidth !== fogW) paintFog();
    });
    function revealFog() {
      if (fogDone) return;
      fogDone = true;
      fogCv.classList.add("gone");
      fogHint.classList.add("off");
      volley(3);
      setTimeout(() => {
        fogCv.remove();
        fogHint.remove();
      }, 1600);
    }
    function wipe(x, y) {
      const r = Math.max(38, Math.min(innerWidth, innerHeight) * 0.07);
      const g = fctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, "rgba(0,0,0,1)");
      g.addColorStop(0.6, "rgba(0,0,0,0.9)");
      g.addColorStop(1, "rgba(0,0,0,0)");
      fctx.globalCompositeOperation = "destination-out";
      fctx.fillStyle = g;
      fctx.beginPath();
      fctx.arc(x, y, r, 0, Math.PI * 2);
      fctx.fill();
      const c0 = Math.max(0, Math.floor((x - r * 0.8) / CELL)), c1 = Math.min(cols - 1, Math.floor((x + r * 0.8) / CELL));
      const r0 = Math.max(0, Math.floor((y - r * 0.8) / CELL)), r1 = Math.min(rows - 1, Math.floor((y + r * 0.8) / CELL));
      for (let j = r0; j <= r1; j++)
        for (let i = c0; i <= c1; i++) {
          const k = j * cols + i;
          if (!seen[k]) { seen[k] = 1; seenN++; }
        }
      if (seenN / (cols * rows) > 0.5) revealFog();
    }
    let wiping = false, lx = 0, ly = 0;
    fogCv.addEventListener("pointerdown", (e) => {
      wiping = true;
      lx = e.clientX;
      ly = e.clientY;
      fogCv.setPointerCapture(e.pointerId);
      fogHint.classList.add("off");
      wipe(lx, ly);
    });
    fogCv.addEventListener("pointermove", (e) => {
      if (!wiping || fogDone) return;
      const dx = e.clientX - lx, dy = e.clientY - ly, n = Math.max(1, Math.ceil(Math.hypot(dx, dy) / 14));
      for (let i = 1; i <= n; i++) wipe(lx + (dx * i) / n, ly + (dy * i) / n);
      lx = e.clientX;
      ly = e.clientY;
    });
    const stopWipe = () => (wiping = false);
    fogCv.addEventListener("pointerup", stopWipe);
    fogCv.addEventListener("pointercancel", stopWipe);

    const cur = document.createElement("div");
    cur.id = "cur";
    cur.innerHTML = "<span>❤</span>";
    document.body.appendChild(cur);
    let lt = 0;
    addEventListener("pointermove", (e) => {
      cur.style.transform = `translate(${e.clientX}px,${e.clientY}px) translate(-50%,-50%)`;
      cur.style.opacity = 1;
      const n = performance.now();
      if (n - lt < 50) return;
      lt = n;
      const t = document.createElement("div");
      t.className = "trail";
      t.textContent = rnd(["❤", "💖", "💗", "💕"]);
      t.style.cssText += `left:${e.clientX}px;top:${e.clientY}px;font-size:${R(10, 20)}px;--tx:${R(-30, 30)}px`;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 1100);
    });
    document.addEventListener("mouseleave", () => (cur.style.opacity = 0));
    $("card").addEventListener("click", (e) => {
      if (e.target.tagName !== "BUTTON") {
        for (let i = 0; i < 6; i++) burst(e.clientX, e.clientY, rnd(HEARTS), 18);
        ripple(e.clientX, e.clientY);
        firework(e.clientX, e.clientY, Math.random() < 0.5 ? "heart" : "round");
      }
    });
  </script>
</body>

</html>
